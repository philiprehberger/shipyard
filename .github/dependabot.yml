version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, go]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    # typescript is pinned to an exact 6.x in web/package.json because Next
    # 16.2 cannot detect TypeScript 7 (see commit aa623b0). Without this rule
    # Dependabot re-proposes 7.x and walks the pin forward again, taking
    # `npm run build` — and therefore every deploy — down.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
