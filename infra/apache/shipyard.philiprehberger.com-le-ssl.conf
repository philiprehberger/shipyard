<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName shipyard.philiprehberger.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3013/
    ProxyPassReverse / http://127.0.0.1:3013/

    # Docs site is static SSG — no SSE / websocket / streaming. Default
    # ProxyTimeout is fine.

    ErrorLog ${APACHE_LOG_DIR}/shipyard-error.log
    CustomLog ${APACHE_LOG_DIR}/shipyard-access.log combined

SSLCertificateFile /etc/letsencrypt/live/shipyard.philiprehberger.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/shipyard.philiprehberger.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
