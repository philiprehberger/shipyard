# Apache vhost for the Shipyard docs site.
# Reverse-proxies to the PM2-managed Next.js standalone server on :3013.
#
# Install:
#   sudo cp infra/apache/shipyard.philiprehberger.com.conf \
#           /etc/apache2/sites-available/
#   sudo a2ensite shipyard.philiprehberger.com.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#   sudo certbot --apache -d shipyard.philiprehberger.com
#
# After certbot, the matching shipyard.philiprehberger.com-le-ssl.conf
# is generated and the port-80 block below grows a redirect rule.

<VirtualHost *:80>
    ServerName shipyard.philiprehberger.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3013/
    ProxyPassReverse / http://127.0.0.1:3013/

    # Docs site is static SSG — no SSE / websocket / streaming. Default
    # ProxyTimeout is fine.

    ErrorLog ${APACHE_LOG_DIR}/shipyard-error.log
    CustomLog ${APACHE_LOG_DIR}/shipyard-access.log combined
</VirtualHost>
