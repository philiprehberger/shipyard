run:
  timeout: 5m
  go: "1.23"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec
    - unconvert
    - prealloc
    - bodyclose
    - nilerr
    - rowserrcheck

linters-settings:
  revive:
    rules:
      - name: exported
        arguments: ["disableStutteringCheck"]
      - name: var-naming
      - name: package-comments
        disabled: true
      - name: indent-error-flow
      - name: error-return
      - name: error-strings
      - name: error-naming
  gosec:
    excludes:
      - G204  # Subprocess launched with variable — unavoidable in a tool that runs shell hooks

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
